{# Khung cắt ảnh tròn DÙNG CHUNG: gắn data-cat-anh vào 1 <input type=file>
   nằm trong 1 <form>; chọn ảnh xong sẽ mở khung kéo/phóng to, bấm "Cắt & lưu"
   thì thay file bằng ảnh vuông 512x512 đã cắt rồi submit form đó. #}
<div id="cat-anh-chung" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(20,20,18,.6);
     align-items:center;justify-content:center;padding:16px">
  <div class="the" style="width:min(380px,100%);margin:0;text-align:center">
    <h3 style="margin:0 0 4px">Cắt ảnh đại diện</h3>
    <p style="color:var(--muc-mo);font-size:.84rem;margin:0 0 12px">Kéo ảnh để chọn vùng, thanh trượt để phóng to/thu nhỏ.</p>
    <canvas id="cat-anh-chung-canvas" width="300" height="300"
            style="width:300px;max-width:100%;aspect-ratio:1;border-radius:12px;background:#222;cursor:grab;touch-action:none"></canvas>
    <input type="range" id="cat-anh-chung-zoom" min="1" max="4" step="0.01" value="1" style="width:100%;margin:12px 0">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="nut nut--phu nut--nho" id="cat-anh-chung-huy">Huỷ</button>
      <button type="button" class="nut nut--nho" id="cat-anh-chung-luu">Cắt &amp; lưu</button>
    </div>
  </div>
</div>
<script>
(function () {
  const hop = document.getElementById('cat-anh-chung');
  const cv = document.getElementById('cat-anh-chung-canvas');
  const ctx = cv.getContext('2d');
  const zoom = document.getElementById('cat-anh-chung-zoom');
  const W = cv.width, R = W / 2 - 6;
  let img = null, tiLeGoc = 1, tiLe = 1, x = 0, y = 0, keo = null, oDangCat = null;

  function gioiHan() {
    const w = img.width * tiLe, h = img.height * tiLe;
    x = Math.min(W / 2 - R, Math.max(W / 2 + R - w, x));
    y = Math.min(W / 2 - R, Math.max(W / 2 + R - h, y));
  }
  function ve() {
    ctx.clearRect(0, 0, W, W);
    ctx.drawImage(img, x, y, img.width * tiLe, img.height * tiLe);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.rect(0, 0, W, W); ctx.arc(W / 2, W / 2, R, 0, Math.PI * 2, true); ctx.fill('evenodd');
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, W / 2, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  function datZoom(z) {
    const tx = (W / 2 - x) / tiLe, ty = (W / 2 - y) / tiLe;
    tiLe = tiLeGoc * z; x = W / 2 - tx * tiLe; y = W / 2 - ty * tiLe; gioiHan(); ve();
  }
  function toaDo(e) { const r = cv.getBoundingClientRect(), k = W / r.width; return [(e.clientX - r.left) * k, (e.clientY - r.top) * k]; }

  document.querySelectorAll('input[type=file][data-cat-anh]').forEach((o) => {
    o.addEventListener('change', () => {
      const f = o.files[0];
      if (!f) return;
      oDangCat = o;
      img = new Image();
      img.onload = () => {
        tiLeGoc = (2 * R) / Math.min(img.width, img.height); tiLe = tiLeGoc; zoom.value = 1;
        x = (W - img.width * tiLe) / 2; y = (W - img.height * tiLe) / 2;
        hop.style.display = 'flex'; ve();
      };
      img.src = URL.createObjectURL(f);
    });
  });
  zoom.addEventListener('input', () => datZoom(parseFloat(zoom.value)));
  cv.addEventListener('pointerdown', (e) => { keo = toaDo(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => {
    if (!keo || !img) return;
    const [px, py] = toaDo(e); x += px - keo[0]; y += py - keo[1]; keo = [px, py]; gioiHan(); ve();
  });
  cv.addEventListener('pointerup', () => { keo = null; });
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom.value = Math.min(4, Math.max(1, parseFloat(zoom.value) - e.deltaY * 0.002)); datZoom(parseFloat(zoom.value));
  }, { passive: false });
  document.getElementById('cat-anh-chung-huy').addEventListener('click', () => {
    hop.style.display = 'none'; if (oDangCat) oDangCat.value = '';
  });
  document.getElementById('cat-anh-chung-luu').addEventListener('click', () => {
    const KT = 512, ra = document.createElement('canvas'); ra.width = ra.height = KT;
    const k = KT / (2 * R);
    ra.getContext('2d').drawImage(img, (x - (W / 2 - R)) * k, (y - (W / 2 - R)) * k, img.width * tiLe * k, img.height * tiLe * k);
    ra.toBlob((blob) => {
      const dt = new DataTransfer();
      dt.items.add(new File([blob], 'anh-dai-dien.png', { type: 'image/png' }));
      oDangCat.files = dt.files;
      oDangCat.closest('form').submit();
    }, 'image/png');
  });
})();
</script>
